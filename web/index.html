<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>daisy2telmi — DAISY 2.02 to Telmi, Lunii or Flam story converter</title>
    <meta
      name="description"
      content="Convert a DAISY 2.02 audiobook pack into a Telmi, Lunii or Flam story, entirely in your browser."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>daisy2telmi</h1>
        <p class="tagline" data-i18n="tagline"></p>
        <label class="lang">
          <span data-i18n="language"></span>
          <select id="lang"></select>
        </label>
      </header>

      <section class="card">
        <div id="drop" class="drop" tabindex="0">
          <p><strong data-i18n="drop_title"></strong></p>
          <p class="muted" data-i18n="drop_hint"></p>
          <div class="pickers">
            <label class="button">
              <span data-i18n="pick_zip"></span>
              <input id="picker" type="file" accept=".zip" />
            </label>
            <label class="button">
              <span data-i18n="pick_folder"></span>
              <input id="folder-picker" type="file" webkitdirectory directory multiple />
            </label>
          </div>
        </div>

        <!-- The player comes first: its screen decides the size every picture is drawn at. -->
        <div class="format-row">
          <span class="muted" data-i18n="format_label"></span>
          <label>
            <input type="radio" name="format" value="telmi" checked />
            <span data-i18n="fmt_telmi"></span>
          </label>
          <label>
            <input type="radio" name="format" value="lunii" />
            <span data-i18n="fmt_lunii"></span>
          </label>
          <label>
            <input type="radio" name="format" value="flam" />
            <span data-i18n="fmt_flam"></span>
          </label>
          <!-- Only the Lunii archive carries the flag: the Telmi player keeps night
               mode as a device setting. -->
          <label id="night-row" hidden>
            <input id="night-mode" type="checkbox" checked />
            <span data-i18n="night_mode"></span>
          </label>
        </div>

        <div class="cover">
          <div class="cover-head">
            <h2 data-i18n="cover_title"></h2>
            <a id="cover-search" class="quiet" target="_blank" rel="noopener" data-i18n="cover_search"></a>
          </div>
          <p class="muted" data-i18n="cover_hint"></p>
          <div class="cover-row">
            <label class="button">
              <span data-i18n="cover_pick"></span>
              <input id="cover-picker" type="file" accept="image/*" />
            </label>
            <input id="cover-url" type="url" data-i18n-placeholder="cover_url" />
            <button id="cover-use" type="button" data-i18n="cover_use"></button>
            <button id="cover-clear" type="button" hidden data-i18n="cover_clear"></button>
          </div>
          <img id="cover-preview" alt="" hidden />
          <div id="crop-row" class="crop-row" hidden>
            <span class="muted" data-i18n="cover_crop_label"></span>
            <label class="crop">
              <input type="radio" name="crop" value="top" />
              <img alt="" /><span data-i18n="crop_top"></span>
            </label>
            <label class="crop">
              <input type="radio" name="crop" value="center" />
              <img alt="" /><span data-i18n="crop_center"></span>
            </label>
            <label class="crop">
              <input type="radio" name="crop" value="bottom" />
              <img alt="" /><span data-i18n="crop_bottom"></span>
            </label>
          </div>
        </div>

        <div class="cut">
          <h2 data-i18n="cut_title"></h2>
          <p class="muted" data-i18n="cut_hint"></p>
          <!-- Shut until the pack has been read: which levels it can cut at comes from its own outline. -->
          <div class="cut-row">
            <label>
              <input id="cut-chapter" type="radio" name="cut" value="chapter" checked disabled />
              <span data-i18n="cut_chapter"></span>
            </label>
            <label>
              <input id="cut-paragraph" type="radio" name="cut" value="paragraph" disabled />
              <span data-i18n="cut_paragraph"></span>
            </label>
            <label>
              <input id="cut-sentence" type="radio" name="cut" value="sentence" disabled />
              <span data-i18n="cut_sentence"></span>
            </label>
          </div>
        </div>

        <!-- The parts the pack was cut into, so unwanted ones can be left out.
             The numbers mean the parts of the chosen level, so the list is drawn
             again whenever that level changes. -->
        <div id="parts" class="parts" hidden>
          <div class="parts-head">
            <h2 data-i18n="parts_title"></h2>
            <button id="parts-all" type="button" class="quiet" hidden data-i18n="parts_all"></button>
          </div>
          <p class="muted" data-i18n="parts_hint"></p>
          <p id="parts-note" class="muted"></p>
          <div id="parts-list" class="parts-list"></div>
        </div>

        <div id="summary" class="summary" hidden></div>

        <div class="actions">
          <button id="save" type="button" disabled data-i18n="save"></button>
          <a id="download" class="button primary" hidden download data-i18n="download"></a>
        </div>

        <progress id="bar" max="1" value="0" hidden></progress>
        <pre id="log" aria-live="polite"></pre>
      </section>

      <section class="card">
        <h2 data-i18n="what_title"></h2>
        <p data-i18n="what_p1"></p>
        <p data-i18n-html="what_p2"></p>
      </section>

      <section class="card">
        <h2 data-i18n="before_title"></h2>
        <ul>
          <li data-i18n="before_1"></li>
          <li data-i18n="before_2"></li>
          <li data-i18n="before_3"></li>
          <li data-i18n="before_4"></li>
        </ul>
      </section>

      <section class="card">
        <h2 data-i18n="desktop_title"></h2>
        <p data-i18n="desktop_p1"></p>
        <p data-i18n-html="desktop_line"></p>
      </section>

      <footer>
        <p data-i18n-html="footer_line"></p>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
