name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      # choco does not refresh PATH for later steps, so install ffmpeg and build in
      # one step and hand build_windows.py the resolved path.
      - name: Build daisy2telmi.exe
        run: |
          choco install ffmpeg -y
          $ff = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ff) {
            $ff = (Get-ChildItem C:\tools, C:\ProgramData\chocolatey -Recurse -Filter ffmpeg.exe `
                    -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $ff) { Write-Error "ffmpeg install produced no ffmpeg.exe"; exit 1 }
          Write-Host "bundling ffmpeg: $ff"
          $env:DAISY2TELMI_FFMPEG = $ff
          python build_windows.py
          exit $LASTEXITCODE
      - name: Smoke test the exe
        run: dist\daisy2telmi.exe --version
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: daisy2telmi-windows
          path: dist/daisy2telmi.exe
      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/daisy2telmi.exe
