name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # build_windows.py embeds this ffmpeg into the exe, so the end user needs none.
      - name: Install ffmpeg
        run: choco install ffmpeg -y
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build daisy2telmi.exe
        run: python build_windows.py
      - name: Smoke test the exe
        run: dist\daisy2telmi.exe --version
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: daisy2telmi-windows
          path: dist/daisy2telmi.exe
      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/daisy2telmi.exe
